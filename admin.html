<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
</head>
<body>
<h2>Admin Panel - Add Officer / Book / Announcement</h2>
<h3>Add Officer</h3>
<input id="military_id" placeholder="Military ID"><input id="full_name" placeholder="Full Name"><input id="email" placeholder="Email for Login"><input id="tempPass" placeholder="Temp Password"><button onclick="addOfficer()">Add Officer</button>

<h3>Upload Book (Non-Editable)</h3>
<input id="bookTitle" placeholder="Book Title"><input type="file" id="bookFile"><button onclick="uploadBook()">Upload Secure</button>

<script>
firebase.initializeApp({ apiKey: "YOUR_API_KEY", authDomain: "police-batch-2026.firebaseapp.com", projectId: "police-batch-2026" });
const db = firebase.firestore(); const auth = firebase.auth(); const storage = firebase.storage();

async function addOfficer(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('tempPass').value;
  const cred = await auth.createUserWithEmailAndPassword(email, pass);
  await db.collection('officers').doc(cred.user.uid).set({
    military_id: document.getElementById('military_id').value,
    full_name: document.getElementById('full_name').value,
    email: email,
    role: 'officer',
    created_at: firebase.firestore.FieldValue.serverTimestamp()
  });
  alert('Officer Added - Admin Only');
}

async function uploadBook(){
  const file = document.getElementById('bookFile').files[0];
  const title = document.getElementById('bookTitle').value;
  const ref = storage.ref(`books_encrypted/${Date.now()}_${file.name}`);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection('elibrary_books').add({ title: title, file_url: url, is_encrypted: true, created_at: firebase.firestore.FieldValue.serverTimestamp() });
  alert('Book uploaded as non-downloadable secure file');
}
</script>
</body>
</html>
