<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:20px;user-select:none}
.card{background:#1e293b;padding:15px;margin:10px;border-radius:8px}
img{max-width:100%;border-radius:6px}
.wm{position:fixed;opacity:0.08;pointer-events:none;transform:rotate(-30deg);font-size:20px;z-index:9999}
</style>
</head>
<body>
<div id="watermark" class="wm"></div>
<h1 id="welcome"></h1>
<div class="card"><h3>Announcement Board</h3><div id="ann"></div></div>
<div class="card"><h3>E-Library (View Only)</h3><div id="books"></div></div>
<div class="card"><h3>Batch Memories</h3><div id="memories"></div></div>
<div class="card"><h3>Officers Profiles</h3><div id="officers"></div></div>

<script>
const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "police-batch-2026.firebaseapp.com", projectId: "police-batch-2026" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const officer = JSON.parse(localStorage.getItem('officer'));
document.getElementById('welcome').innerText = `Welcome ${officer.rank} ${officer.full_name}`;
document.getElementById('watermark').innerText = `${officer.full_name} | ${officer.military_id} | ${new Date().toLocaleString()}`;

// Load Announcements
db.collection('announcements').orderBy('created_at','desc').onSnapshot(snap=>{
  let h=''; snap.forEach(d=>{ h+=`<p><b>${d.data().title}</b>: ${d.data().content}</p>` }); document.getElementById('ann').innerHTML=h;
});
// Load Books - Secure View (Image only)
db.collection('elibrary_books').onSnapshot(snap=>{
  let h=''; snap.forEach(d=>{ h+=`<p>${d.data().title} - <button onclick="viewBook('${d.id}')">View Secure</button></p>` }); document.getElementById('books').innerHTML=h;
});
function viewBook(id){
  // Opens secure viewer that serves image with watermark, no download
  window.open(`secure_viewer.html?book=${id}`,'_blank','width=800,height=900');
}
// Load Officers
db.collection('officers').onSnapshot(snap=>{
  let h=''; snap.forEach(d=>{ const o=d.data(); h+=`<div><img src="${o.photo_url}" width="50"> ${o.rank} ${o.full_name} - ${o.phone} - ${o.residence}</div>` }); document.getElementById('officers').innerHTML=h;
});
</script>
</body>
</html>
