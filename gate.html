<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate Check</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{background:#070b1a;color:#fff;font-family:sans-serif;text-align:center;padding:16px}.card{background:#111b3d;padding:16px;border-radius:16px;max-width:500px;margin:auto}</style>
</head><body>
<div class="card"><h3>فحص التذاكر - بوابة استاد جوبا</h3><div id="reader" style="width:100%"></div><p id="result"></p></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",authDomain:"ssnps-police-app-7018f.firebaseapp.com",projectId:"ssnps-police-app-7018f",storageBucket:"ssnps-police-app-7018f.firebasestorage.app",messagingSenderId:"705275454318",appId:"1:705275454318:web:a3cb76139563b6c33d977f"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
const esc=s=> (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function onScanSuccess(decodedText){
 db.collection('juba_tickets').doc(decodedText).get().then(doc=>{
  if(!doc.exists){document.getElementById('result').innerHTML='<b style="color:#ff3b5c">❌ تذكرة غير موجودة</b>';return}
  const t=doc.data(); if(t.used){document.getElementById('result').innerHTML='<b style="color:orange">⚠️ مستخدمة من قبل: '+esc(t.fanName)+'</b>';return}
  document.getElementById('result').innerHTML='<b style="color:#00ff88">✅ صالحة: '+esc(t.team1)+' vs '+esc(t.team2)+' - '+esc(t.grade)+' - '+esc(t.fanName)+'</b>';
  db.collection('juba_tickets').doc(decodedText).update({used:true,usedAt:Date.now()});
 });
}
new Html5QrcodeScanner("reader",{fps:10,qrbox:250}).render(onScanSuccess);
</script>
</body></html>
