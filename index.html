<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSNPS Police Academy</title>

<!-- PWA - مهم جدا لـ PWABuilder -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16213e">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/512/1695/1695632.png">
<meta name="description" content="South Sudan National Police Service - Training Academy System">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0a0e1a;color:#fff;min-height:100vh}
header{background:#16213e;padding:15px;text-align:center;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:10}
.btn{background:#0f3460;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;margin:5px;font-weight:700}
.btn:hover{background:#1a4a7a}
.btn.dark{background:#e94560}
.card{background:#16213e;padding:15px;border-radius:12px;margin:12px 0;border:1px solid #ffffff11}
input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:none;outline:none;background:#0a0e1a;color:#fff;border:1px solid #ffffff22}
#loginBox{max-width:380px;margin:60px auto;padding:20px}
.hidden{display:none}
a{color:#4fc3f7;text-decoration:none}
#installBtn{background:#00c853;display:none;width:100%;margin-top:10px}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
<h2>🇸🇸 SSNPS Police Academy</h2>
<p style="opacity:.7;font-size:12px">Training Management System V12 - PWA Ready</p>
</header>

<!-- Login -->
<div id="loginBox" class="card">
<h3>Login</h3>
<input id="userId" placeholder="ID e.g. SSNPS-5293">
<input id="userPass" type="password" placeholder="Password e.g. 5293">
<button class="btn" id="loginBtn" style="width:100%">Login</button>
<button class="btn" id="installBtn">📲 تثبيت التطبيق</button>
<p id="loginMsg" style="margin-top:8px;color:#ff6b6b;font-size:13px"></p>
</div>

<!-- App -->
<div id="appBox" class="hidden" style="padding:15px;max-width:900px;margin:auto">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
<h3 id="welcome"></h3>
<button class="btn dark" id="logoutBtn">Logout</button>
</div>

<div class="card">
<h3>👮 Add New Soldier</h3>
<input id="soldierName" placeholder="Soldier Full Name">
<button class="btn" id="addSoldierBtn">Generate & Add</button>
<p id="soldierMsg" style="font-size:13px;margin-top:6px"></p>
</div>

<div class="card">
<h3>📋 Soldiers List</h3>
<div id="soldiersList">Loading...</div>
</div>

<div class="card">
<h3>📚 Police Library</h3>
<p style="font-size:11px;opacity:.6;margin-bottom:8px">ارفع الـ PDF في فولدر books في GitHub ثم اكتب رابطو هنا</p>
<input id="pdfTitle" placeholder="اسم الكتاب e.g. Criminal Law">
<input id="pdfUrl" placeholder="رابط الكتاب e.g. books/criminal-law.pdf">
<button class="btn dark" id="addBookBtn" style="width:100%">Add Book to Library</button>
<p id="uploadStatus" style="font-size:13px;margin-top:6px"></p>
<div id="booksList" style="margin-top:12px"></div>
</div>
</div>

<script>
// Firebase - استخدم الكونفج حقك لو عندك
const firebaseConfig = {
  apiKey: "AIzaSyDummyKey-Replace-With-Real",
  authDomain: "ssnps-police-app-7018f.firebaseapp.com",
  projectId: "ssnps-police-app-7018f",
  storageBucket: "ssnps-police-app-7018f.firebasestorage.app",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
try{ firebase.initializeApp(firebaseConfig); }catch(e){}
const db = firebase.firestore();
const sanitize = t => t.replace(/[<>]/g,'');
let currentUser=null;
const defaultUsers={"SSNPS-5293":{pass:"5293",role:"admin",name:"Admin"},"SSNPS-0001":{pass:"0001",role:"soldier",name:"Soldier 1"}};

async function login(){
 const id=sanitize(document.getElementById('userId').value.trim());
 const pass=document.getElementById('userPass').value.trim();
 if(defaultUsers[id] && defaultUsers[id].pass===pass){ currentUser={id,...defaultUsers[id]}; showApp(); return; }
 try{
  const doc=await db.collection('soldiers').doc(id).get();
  if(doc.exists){ currentUser={id,...doc.data()}; showApp(); return; }
 }catch(e){}
 document.getElementById('loginMsg').textContent='Invalid ID or Password';
}
function showApp(){
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('appBox').classList.remove('hidden');
 document.getElementById('welcome').textContent='Welcome: '+currentUser.name+' ('+currentUser.id+')';
 loadSoldiers(); loadBooks();
}
document.getElementById('loginBtn').onclick=login;
document.getElementById('logoutBtn').onclick=()=>location.reload();
document.getElementById('addSoldierBtn').onclick=async()=>{
 const name=sanitize(document.getElementById('soldierName').value.trim());
 if(!name){ document.getElementById('soldierMsg').textContent='اكتب الاسم'; return; }
 const newId='SSNPS-'+Math.floor(1000+Math.random()*9000);
 try{ await db.collection('soldiers').doc(newId).set({name,id:newId,created:Date.now()}); document.getElementById('soldierMsg').textContent='✅ تمت إضافة '+name+' : '+newId; document.getElementById('soldierName').value=''; loadSoldiers(); }catch(e){ document.getElementById('soldierMsg').textContent='Error: '+e.message; }
};
async function loadSoldiers(){
 try{
  const snap=await db.collection('soldiers').orderBy('created','desc').get();
  let html='<b>Total: '+snap.size+'</b><br><br>';
  snap.forEach(d=>{ const x=d.data(); html+=`<div style="padding:8px;border-bottom:1px solid #ffffff22">${x.name} - <b>${x.id}</b></div>`; });
  document.getElementById('soldiersList').innerHTML=html||'No soldiers';
 }catch(e){ document.getElementById('soldiersList').innerHTML='Offline mode'; }
}
document.getElementById('addBookBtn').onclick=async()=>{
 const title=sanitize(document.getElementById('pdfTitle').value.trim());
 const url=sanitize(document.getElementById('pdfUrl').value.trim());
 if(!title||!url){ alert('اكتب الاسم والرابط'); return; }
 try{ await db.collection('library').add({title,url,created:Date.now()}); document.getElementById('uploadStatus').textContent='✅ تمت إضافة '+title; document.getElementById('pdfTitle').value=''; document.getElementById('pdfUrl').value=''; loadBooks(); }catch(e){ document.getElementById('uploadStatus').textContent='Error: '+e.message; }
};
async function loadBooks(){
 try{
  const snap=await db.collection('library').orderBy('created','desc').get();
  let html=snap.empty?'لا يوجد كتب بعد':'';
  snap.forEach(doc=>{ const d=doc.data(); html+=`<div style="padding:10px;border-bottom:1px solid #ffffff22"><b>${d.title}</b><br><a href="${d.url}" target="_blank">📖 قراءة / تحميل</a></div>`; });
  document.getElementById('booksList').innerHTML=html;
 }catch(e){ document.getElementById('booksList').innerHTML='Offline'; }
}

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='block'; });
document.getElementById('installBtn').onclick=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').style.display='none'; } };

// Service Worker - مكانو الصحيح هنا قبل </body>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(()=>console.log('SW Ready')).catch(()=>navigator.serviceWorker.register('./sw.js'));
  });
}
</script>
</body>
</html>
