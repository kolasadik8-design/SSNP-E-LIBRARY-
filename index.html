<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSNPS POLICE APP PRO - FIREBASE</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#eef2f7}
.header{background:#16213e;color:#fff;text-align:center;padding:16px}
.card{background:#fff;border-radius:18px;padding:14px;margin:10px;box-shadow:0 2px 8px #0001}
.btn{border:none;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.gold{background:#c9a030;color:#000}.dark{background:#16213e;color:#fff}.red{background:#b42323;color:#fff}
input{padding:11px;width:100%;margin:6px 0;border-radius:10px;border:1px solid #ccc}
.badge{background:#d4af37;color:#000;padding:3px 10px;border-radius:20px;font-size:11px}
.gen-box{background:#f0fdf4;border:2px dashed #16a34a;padding:12px;border-radius:12px;margin:10px 0;font-family:monospace}
footer{text-align:center;padding:18px;background:#16213e;color:#fff;margin-top:20px}
</style>
</head>
<body>
<div class="header"><h1>SSNPS POLICE APP <span class="badge">V10 FIREBASE LIVE</span></h1></div>

<div id="loginPage" class="card" style="max-width:400px;margin:30px auto">
<h3 style="text-align:center">SSNPS LOGIN</h3>
<input id="loginId" placeholder="ID e.g. SSNPS-5293"><input id="loginPass" type="password" placeholder="Password">
<button class="btn dark" style="width:100%" id="loginBtn">Login</button><p id="loginErr" style="color:red;font-size:12px;text-align:center"></p>
</div>

<div id="app" style="display:none">
<div style="display:flex;gap:6px;padding:10px;margin:10px;background:#fff;border-radius:16px;overflow:auto">
<button class="btn gold" id="bLib">Library</button>
<button class="btn gold" id="bCases">Cases</button>
<button class="btn gold" id="bRes">Results</button>
<span id="userInfo" style="margin-left:auto;font-size:11px;padding:6px"></span>
<button class="btn red" id="bOut">Logout</button>
</div>

<div id="adminPanel" class="card" style="display:none;border:2px dashed #c9a030">
<h3>👮 Admin - Add Soldier (Auto Generate)</h3>
<input id="searchSold" placeholder="🔍 بحث باسم المستجد أو الـ ID..." style="background:#f8fafc">
<div style="display:flex;gap:6px;margin-top:8px"><input id="newSoldName" placeholder="Full Name e.g. Ali Hassan" maxlength="40"><button class="btn dark" id="addSoldBtn" style="width:170px">Generate & Add</button></div>
<div id="genResult"></div><p id="soldStatus" style="font-size:12px;color:green"></p><div id="soldList" style="font-size:13px;margin-top:8px"></div>
</div>

<div id="vLib" class="card"><h3>Dashboard</h3><p id="status">Connecting to Firebase...</p></div>
<div id="vCases" style="display:none" class="card"><h3>Cases Module - 10 Civil/Criminal Cases Ready</h3></div>
<div id="vRes" style="display:none" class="card"><h3>Results</h3><p>Saved in Firestore</p></div>
</div>

<footer>For more info call <a href="tel:0928813308" style="color:#d4af37;text-decoration:none;font-weight:700">0928813308</a></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",
  authDomain: "ssnps-police-app-7018f.firebaseapp.com",
  projectId: "ssnps-police-app-7018f",
  storageBucket: "ssnps-police-app-7018f.firebasestorage.app",
  messagingSenderId: "705275454318",
  appId: "1:705275454318:web:a3cb76139563b6c33d977f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const USERS_RAW=[{id:"SSNPS-5293",pass:"5293",name:"Admin Ahmed",role:"admin"}];
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function sanitize(str){return (str||'').replace(/[<>"'`;]/g,'').trim();}
let USERS=[];let ready=false;

async function initUsers(){
 USERS=[];
 for(const u of USERS_RAW){USERS.push({id:u.id,name:u.name,role:u.role,hash:await sha256(u.pass),plain:u.pass});}
 try{
  const snap=await db.collection('soldiers').get();
  snap.forEach(doc=>{const d=doc.data();if(!USERS.find(x=>x.id===d.id))USERS.push(d);});
  document.getElementById('status').textContent='✅ Firebase Connected - '+USERS.length+' soldiers - Dashboard Ready';
 }catch(e){
  document.getElementById('status').textContent='⚠️ Firestore not enabled yet - Enable it in console. '+e.message;
 }
 ready=true;
 checkAuth();
}
function getUser(){try{return JSON.parse(localStorage.getItem('ssnps_user')||'null');}catch{return null;}}
function genId(){const nums=USERS.map(u=>{const m=u.id.match(/(\d+)/);return m?parseInt(m[1]):0;});return 'SSNPS-'+(Math.max(...nums,1000)+1);}
function genPass(){const c='ABCDEFGHJKLMNP23456789';let p='';for(let i=0;i<6;i++)p+=c[Math.floor(Math.random()*c.length)];return p;}

async function doLogin(){
 if(!ready){document.getElementById('loginErr').textContent='Loading...';return;}
 const id=sanitize(document.getElementById('loginId').value).toUpperCase();
 const pass=sanitize(document.getElementById('loginPass').value);
 if(!id||!pass){document.getElementById('loginErr').textContent='Enter ID & Pass';return;}
 const h=await sha256(pass);
 const u=USERS.find(x=>x.id===id&&x.hash===h);
 if(!u){document.getElementById('loginErr').textContent='Wrong ID or Password';return;}
 localStorage.setItem('ssnps_user',JSON.stringify({id:u.id,name:u.name,role:u.role}));
 checkAuth();
}
function checkAuth(){
 const u=getUser();
 const lp=document.getElementById('loginPage');const app=document.getElementById('app');
 if(!u){lp.style.display='block';app.style.display='none';return;}
 lp.style.display='none';app.style.display='block';
 document.getElementById('userInfo').textContent=u.name+' ('+u.id+')';
 if(u.role==='admin'){document.getElementById('adminPanel').style.display='block';renderSoldList();}
}
function renderSoldList(filter=''){
 const el=document.getElementById('soldList');let list=USERS.filter(u=>u.role!=='admin');
 if(filter){const f=filter.toLowerCase();list=list.filter(u=>u.name.toLowerCase().includes(f)||u.id.toLowerCase().includes(f));}
 el.innerHTML='<b>All Soldiers: '+list.length+'</b><div style="max-height:300px;overflow:auto;margin-top:6px">'+list.map(u=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+u.id+' - '+u.name+' | Pass: '+(u.plain||'***')+'</span><button onclick="delSold(\''+u.id+'\')" style="background:#fee2e2;border:none;border-radius:6px;padding:2px 8px;cursor:pointer">X</button></div>').join('')+'</div>';
}
window.delSold=async function(id){
 if(!confirm('Delete '+id+'?'))return;
 if(getUser().id===id){alert('Cannot delete self');return;}
 try{await db.collection('soldiers').doc(id).delete();USERS=USERS.filter(u=>u.id!==id);renderSoldList(document.getElementById('searchSold').value);}catch(e){alert(e.message);}
}

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('bOut').addEventListener('click',()=>{localStorage.removeItem('ssnps_user');location.reload();});
document.getElementById('bLib').addEventListener('click',()=>{document.getElementById('vLib').style.display='block';document.getElementById('vCases').style.display='none';document.getElementById('vRes').style.display='none';});
document.getElementById('bCases').addEventListener('click',()=>{document.getElementById('vLib').style.display='none';document.getElementById('vCases').style.display='block';document.getElementById('vRes').style.display='none';});
document.getElementById('bRes').addEventListener('click',()=>{document.getElementById('vLib').style.display='none';document.getElementById('vCases').style.display='none';document.getElementById('vRes').style.display='block';});
document.getElementById('searchSold').addEventListener('input',e=>renderSoldList(e.target.value));
document.getElementById('addSoldBtn').addEventListener('click',async()=>{
 const raw=document.getElementById('newSoldName').value;const name=sanitize(raw);
 const status=document.getElementById('soldStatus');
 if(name.length<3){status.textContent='Name min 3 chars';return;}
 const newId=genId();const newPass=genPass();const hash=await sha256(newPass);
 const data={id:newId,name:name,role:'soldier',hash:hash,plain:newPass,created:Date.now()};
 try{
  await db.collection('soldiers').doc(newId).set(data);
  USERS.push(data);
  document.getElementById('genResult').innerHTML='<div class=gen-box>✅ <b>تم التوليد بنجاح</b><br>👤 ID (اسم المستخدم): <b>'+newId+'</b><br>🔑 Password: <b>'+newPass+'</b><br>📛 Name: '+name+'<br><small>انسخها للمستجد - محفوظة في Firebase</small></div>';
  document.getElementById('newSoldName').value='';status.textContent='Added '+newId;renderSoldList();
 }catch(e){status.textContent='Error: Enable Firestore Database first - '+e.message;alert('روح Firebase Console > Firestore Database > Create database > Start in test mode');}
});
initUsers();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
</script>
</body>
</html>
