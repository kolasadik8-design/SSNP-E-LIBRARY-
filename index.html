<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSNPS POLICE APP PRO</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#eef2f7}
.header{background:#16213e;color:#fff;text-align:center;padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;margin:10px;box-shadow:0 2px 8px #0001}
.btn{border:none;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.gold{background:#c9a030;color:#000}.dark{background:#16213e;color:#fff}.red{background:#b42323;color:#fff}
input{padding:12px;width:100%;margin:8px 0;border-radius:10px;border:1px solid #ccc}
.badge{background:#d4af37;color:#000;padding:3px 10px;border-radius:20px;font-size:11px}
footer{text-align:center;padding:20px;background:#16213e;color:#fff;margin-top:30px;font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>SSNPS POLICE APP PRO <span class="badge">V6 FIXED</span></h1></div>

<div id="loginPage" class="card" style="max-width:400px;margin:30px auto;display:block">
<h3 style="text-align:center">SSNPS LOGIN</h3>
<p style="font-size:13px;color:#666;text-align:center">Each soldier uses own ID & Password</p>
<input id="loginId" placeholder="ID e.g. SSNPS-1001">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn dark" style="width:100%" id="loginBtn">Login</button>
<p style="font-size:11px;color:#888;text-align:center;margin-top:10px">Contact Admin for credentials</p>
</div>

<div id="app" style="display:none">
<div style="display:flex;gap:8px;padding:10px;margin:10px;background:#fff;border-radius:16px">
<button class="btn gold" id="bLib">Library</button>
<button class="btn gold" id="bCases">Cases</button>
<span id="userInfo" style="margin-left:auto;font-size:11px;padding:8px"></span>
<button class="btn red" id="bOut">Logout</button>
</div>
<div id="vLib"></div>
<div id="vCases" style="display:none"></div>
</div>

<footer>For more info call <a href="tel:0928813308" style="color:#d4af37;text-decoration:none;font-weight:700">0928813308</a><br><small style="color:#aaa">SSNPS POLICE APP PRO - OFFLINE READY</small></footer>

<script>
const USERS_RAW=[
{id:"SSNPS-5293",pass:"5293",name:"Admin Ahmed",role:"admin"},
{id:"SSNPS-1001",pass:"1001",name:"John Deng",role:"soldier"},
{id:"SSNPS-1002",pass:"1002",name:"Peter",role:"soldier"}
];
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
let USERS=[];
async function initUsers(){USERS=[];for(const u of USERS_RAW){const h=await sha256(u.pass);USERS.push({...u,hash:h});}}
function getUser(){try{return JSON.parse(localStorage.getItem('ssnps_user')||'null');}catch{return null;}}
async function doLogin(){
 const id=document.getElementById('loginId').value.trim().toUpperCase();
 const pass=document.getElementById('loginPass').value.trim();
 if(!id||!pass){alert('Enter ID and Password');return;}
 const h=await sha256(pass);
 const u=USERS.find(x=>x.id===id&&x.hash===h);
 if(!u){alert('Wrong ID or Password');return;}
 localStorage.setItem('ssnps_user',JSON.stringify({id:u.id,name:u.name,role:u.role}));
 location.reload();
}
function checkAuth(){
 const u=getUser();
 const loginPage=document.getElementById('loginPage');
 const app=document.getElementById('app');
 if(!u){loginPage.style.display='block';app.style.display='none';return false;}
 loginPage.style.display='none';app.style.display='block';
 document.getElementById('userInfo').textContent=u.name+' ('+u.id+')';
 renderLibrary();
 return true;
}
function renderLibrary(){
 const el=document.getElementById('vLib');el.replaceChildren();
 const head=document.createElement('div');head.className='card';head.innerHTML='<h3>Library</h3><p>PDFs: 2060, 2008, 2015 - Offline Ready</p>';el.appendChild(head);
 const books=[
 {name:'Police Act 2060',size:'0.61 MB'},
 {name:'Police Act 2008',size:'0.82 MB'},
 {name:'Civil Cases - Beginner to Advanced',size:'5 Cases'},
 {name:'Criminal Cases - Beginner to Advanced',size:'5 Cases'}
 ];
 books.forEach(b=>{
  const c=document.createElement('div');c.className='card';
  const h=document.createElement('h4');h.textContent=b.name;
  const m=document.createElement('small');m.textContent=b.size;
  c.append(h,m);el.appendChild(c);
 });
}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('bOut').addEventListener('click',()=>{localStorage.removeItem('ssnps_user');location.reload();});
document.getElementById('bLib').addEventListener('click',()=>{document.getElementById('vLib').style.display='block';document.getElementById('vCases').style.display='none';});
document.getElementById('bCases').addEventListener('click',()=>{
 document.getElementById('vLib').style.display='none';
 const vc=document.getElementById('vCases');vc.style.display='block';vc.replaceChildren();
 const card=document.createElement('div');card.className='card';card.innerHTML='<h3>Case Solving Module</h3><p>10 Civil & Criminal cases ready - English only</p><p>Scores saved per soldier ID</p>';
 vc.appendChild(card);
});
initUsers().then(()=>{checkAuth();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
