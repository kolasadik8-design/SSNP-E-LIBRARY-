<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSNPS Academy - V13.3 SECURE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:#0a0e1a;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#16213e,#0f3460);padding:18px;text-align:center;border-bottom:2px solid #e9456033;position:sticky;top:0;z-index:10}
.card{background:#16213e;padding:16px;border-radius:14px;margin:12px 0;border:1px solid #ffffff12}
.btn{background:#0f3460;color:#fff;border:none;padding:11px 18px;border-radius:10px;cursor:pointer;font-weight:800}
.btn.dark{background:#e94560}.btn.small{padding:6px 12px;font-size:12px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;background:#0a0e1a;color:#fff;border:1px solid #ffffff22}
#loginBox{max-width:400px;margin:70px auto;padding:24px}.hidden{display:none}
.item{padding:10px 8px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}
.badge{background:#0f3460;padding:4px 10px;border-radius:20px;font-size:11px}
#pdfModal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000e;z-index:999;display:none;flex-direction:column}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header><div style="font-weight:900;font-size:20px">🇸🇸 SSNPS ACADEMY</div><div style="opacity:.6;font-size:11px">V13.3 SECURE - Delete + ReadOnly + OneDevice</div></header>

<div id="loginBox" class="card">
<h3>Secure Login</h3>
<input id="userId" placeholder="Police ID">
<input id="userPass" type="password" placeholder="Password">
<button class="btn" id="loginBtn" style="width:100%;margin-top:8px">LOGIN</button>
<p id="loginMsg" style="color:#ff6b6b;margin-top:10px;font-size:13px"></p>
</div>

<div id="appBox" class="hidden" style="padding:15px;max-width:920px;margin:auto">
<div style="display:flex;justify-content:space-between"><h3 id="welcome"></h3><button class="btn dark small" id="logoutBtn">Logout</button></div>
<div class="card" id="adminOnlyCard">
<h3>👮 Soldiers Management</h3>
<input id="soldierName" placeholder="Full Name of Soldier">
<button class="btn" id="addSoldierBtn">Add Soldier</button>
<div style="display:flex;gap:8px;margin:10px 0"><input id="searchSoldier" placeholder="بحث بالاسم أو الرقم"><button class="btn small" id="searchSoldierBtn">بحث</button></div>
<div id="soldiersList">Loading...</div>
</div>
<div class="card">
<h3>📚 Police Library</h3>
<input type="file" id="pdfFile" accept="application/pdf"><input id="pdfTitle" placeholder="اسم الكتاب"><button class="btn dark" id="addBookBtn" style="width:100%">رفع الكتاب للمكتبة</button>
<p id="uploadStatus" style="font-size:12px;margin-top:6px"></p>
<div id="booksList" style="margin-top:10px"></div>
</div>
</div>

<div id="pdfModal">
<div style="display:flex;justify-content:space-between;padding:12px;background:#16213e"><span id="modalTitle"></span><button class="btn dark small" onclick="closeViewer()">إغلاق ✕</button></div>
<div id="pdfViewer" style="flex:1;background:#000"></div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4", authDomain: "ssnps-police-app-7018f.firebaseapp.com", projectId: "ssnps-police-app-7018f", storageBucket: "ssnps-police-app-7018f.firebasestorage.app", messagingSenderId: "705275454318", appId: "1:705275454318:web:a3cb76139563b6c33d977f" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentUser=null; let allSoldiers=[]; let allBooks=[];
function sanitize(s){return (s||'').trim()}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getDeviceId(){let d=localStorage.getItem('deviceId');if(!d){d='dev-'+Math.random().toString(36).slice(2);localStorage.setItem('deviceId',d)}return d}

document.getElementById('loginBtn').onclick=async()=>{
 const id=sanitize(document.getElementById('userId').value);
 const pass=document.getElementById('userPass').value.trim();
 if(!id||!pass){document.getElementById('loginMsg').textContent='ادخل البيانات';return}
 const logged=localStorage.getItem('loggedSoldierId');
 if(logged && logged!==id){document.getElementById('loginMsg').textContent='هذا الهاتف مسجل به: '+logged+' - ممنوع حسابين';return}
 document.getElementById('loginMsg').textContent='جاري التحقق...';
 try{
   const admin=await db.collection('admins').doc(id).get();
   if(admin.exists && admin.data().pass===pass){currentUser=admin.data();localStorage.setItem('loggedSoldierId',id);getDeviceId();showApp();return}
   const doc=await db.collection('soldiers').doc(id).get();
   if(doc.exists && doc.data().pass===pass){currentUser=doc.data();localStorage.setItem('loggedSoldierId',id);getDeviceId();showApp();return}
 }catch(e){console.error(e); document.getElementById('loginMsg').textContent='خطأ اتصال: '+e.message; return}
 document.getElementById('loginMsg').textContent='بيانات غير صحيحة';
};
function showApp(){
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('appBox').classList.remove('hidden');
 document.getElementById('welcome').textContent='مرحب: '+escapeHtml(currentUser.name)+' ('+(currentUser.role||'soldier')+')';
 if(currentUser.role!=='admin'){document.getElementById('adminOnlyCard').style.display='none';document.addEventListener('contextmenu',e=>e.preventDefault());}
 loadSoldiers();loadBooks();
}
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('loggedSoldierId');location.reload()};
document.getElementById('addSoldierBtn').onclick=async()=>{
 const name=sanitize(document.getElementById('soldierName').value);if(!name)return;
 const newId='SSNPS-'+Math.floor(1000+Math.random()*9000);const pass=newId.split('-')[1];
 await db.collection('soldiers').doc(newId).set({name,id:newId,pass,created:Date.now(),role:'soldier'});
 document.getElementById('soldierName').value='';loadSoldiers();alert('تم: '+newId+' باسورد: '+pass);
};
async function loadSoldiers(){const snap=await db.collection('soldiers').orderBy('created','desc').limit(100).get();allSoldiers=[];snap.forEach(d=>allSoldiers.push(d.data()));renderSoldiers(allSoldiers)}
function renderSoldiers(list){
 let html=`<b>Total: ${list.length}</b><br><br>`;
 list.forEach(x=>{
   if(currentUser.role==='admin'){
     html+=`<div class="item"><span>${escapeHtml(x.name)}</span><span><span class="badge">${escapeHtml(x.id)}</span><button class="btn small dark" style="margin-left:8px" onclick="deleteSoldier('${x.id}')">مسح</button></span></div>`;
   }else{
     html+=`<div class="item"><span>${escapeHtml(x.name)}</span><span class="badge">${escapeHtml(x.id)}</span></div>`;
   }
 });
 document.getElementById('soldiersList').innerHTML=html||'لا يوجد';
}
async function deleteSoldier(id){if(currentUser.role!=='admin')return;if(!confirm('هل تريد مسح '+id+' ؟'))return;await db.collection('soldiers').doc(id).delete();loadSoldiers();}
document.getElementById('searchSoldierBtn').onclick=()=>{const q=document.getElementById('searchSoldier').value.toLowerCase();renderSoldiers(allSoldiers.filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)))};
document.getElementById('addBookBtn').onclick=async()=>{
 if(currentUser.role!=='admin'){alert('للإدارة فقط');return}
 const file=document.getElementById('pdfFile').files[0];const title=sanitize(document.getElementById('pdfTitle').value);
 if(!file||!title){document.getElementById('uploadStatus').textContent='اختر ملف واسم';return}
 if(file.size>900*1024){document.getElementById('uploadStatus').textContent='الملف كبير >900KB';return}
 document.getElementById('uploadStatus').textContent='جاري الرفع...';
 const reader=new FileReader();
 reader.onload=async(e=>{try{await db.collection('library').add({title,data:e.target.result,size:file.size,created:Date.now()});document.getElementById('uploadStatus').textContent='✅ تم';document.getElementById('pdfTitle').value='';loadBooks()}catch(err){document.getElementById('uploadStatus').textContent=err.message}});
 reader.readAsDataURL(file);
};
async function loadBooks(){const snap=await db.collection('library').orderBy('created','desc').limit(50).get();allBooks=[];snap.forEach(d=>allBooks.push({fid:d.id,...d.data()}));renderBooks(allBooks)}
function renderBooks(list){
 let html=list.length?'':'لا يوجد كتب';
 list.forEach(b=>{
   if(currentUser.role==='soldier'){html+=`<div class="item"><span><b>${escapeHtml(b.title)}</b></span><button class="btn small" onclick="viewOnly('${b.fid}')">👁️ قراءة</button></div>`;}
   else{html+=`<div class="item"><span><b>${escapeHtml(b.title)}</b></span><button class="btn small" onclick="downloadBook('${b.fid}')">تحميل</button></div>`;}
 });
 document.getElementById('booksList').innerHTML=html;
}
window.downloadBook=(fid)=>{if(currentUser.role==='soldier'){alert('ممنوع - قراءة فقط');return}const b=allBooks.find(x=>x.fid===fid);const a=document.createElement('a');a.href=b.data;a.download=b.title+'.pdf';a.click();};
window.viewOnly=(fid)=>{const b=allBooks.find(x=>x.fid===fid);document.getElementById('modalTitle').textContent=b.title;document.getElementById('pdfViewer').innerHTML=`<iframe src="${b.data}#toolbar=0&navpanes=0" style="width:100%;height:90vh;border:none"></iframe>`;document.getElementById('pdfModal').style.display='flex';};
window.closeViewer=()=>{document.getElementById('pdfModal').style.display='none';document.getElementById('pdfViewer').innerHTML=''};
</script>
</body>
</html>
