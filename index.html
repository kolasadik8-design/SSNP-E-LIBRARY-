<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSNPS V15.2 FIXED</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#070a14;color:#eaf0ff;min-height:100vh}
header{background:#111a33;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff22}
.card{background:#111a33;border:1px solid #ffffff12;border-radius:16px;padding:16px;margin:12px 0}
.btn{background:#2d6bff;color:#fff;border:none;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:800}
.btn.danger{background:#ff3b5c}.btn.small{padding:7px 12px;font-size:12px}.btn.ghost{background:transparent;border:1px solid #ffffff22;color:#fff}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;background:#080c1d;color:#fff;border:1px solid #ffffff1f}
#loginBox{max-width:420px;margin:60px auto;padding:24px}.hidden{display:none!important}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ffffff0f}
.badge{background:#1a274f;padding:4px 10px;border-radius:20px;font-size:11px}
#pdfModal{position:fixed;inset:0;background:#000e;z-index:99;display:none;flex-direction:column}
</style>
</head>
<body>
<header>
<div>🇸🇸 SSNPS E-LIBRARY</div>
<div><button class="btn small ghost" id="langBtn">EN</button> <button class="btn small ghost" id="logoutBtn" style="display:none">Logout</button></div>
</header>

<div id="loginBox" class="card">
<h3 id="t1">تسجيل دخول آمن</h3>
<input id="userId" placeholder="ID">
<input id="userPass" type="password" placeholder="Password">
<button class="btn" id="loginBtn" style="width:100%;margin-top:8px">دخول / LOGIN</button>
<p id="loginMsg" style="color:#ff6b7a;margin-top:10px;font-size:13px"></p>
<p style="font-size:11px;color:#8aa0d0;margin-top:10px">جرب: ADMIN / Admin@2026</p>
</div>

<div id="appBox" class="hidden" style="max-width:900px;margin:auto;padding:14px">
<h3 id="welcome"></h3>
<div class="card" id="adminCard">
<h3>👮 إدارة الجنود</h3>
<div style="display:flex;gap:8px;margin-top:10px"><input id="soldierName" placeholder="Full Name"><button class="btn" id="addSoldierBtn">إضافة</button></div>
<div style="display:flex;gap:8px;margin:10px 0"><input id="searchSoldier" placeholder="بحث"><button class="btn small" id="searchSoldierBtn">بحث</button></div>
<div id="soldiersList"></div>
</div>
<div class="card">
<h3>📚 المكتبة</h3>
<div id="adminUpload"><input type="file" id="pdfFile" accept="application/pdf"><input id="pdfTitle" placeholder="عنوان الكتاب"><button class="btn danger" id="addBookBtn" style="width:100%">رفع</button><p id="uploadStatus" style="font-size:12px"></p></div>
<div id="booksList" style="margin-top:10px"></div>
</div>
<div class="card"><h3>📞 Contact Us</h3><p style="font-size:13px;color:#8aa0d0;margin-top:6px">Juba, South Sudan - support@ssnps.gov.ss - +211 912 345 678</p></div>
</div>

<div id="pdfModal"><div style="display:flex;justify-content:space-between;padding:12px;background:#111a33"><span id="modalTitle"></span><button class="btn small danger" onclick="closeViewer()">إغلاق</button></div><div id="pdfViewer" style="flex:1;background:#000"></div></div>

<script>
console.log('V15.2 loaded');
const firebaseConfig={apiKey:"AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",authDomain:"ssnps-police-app-7018f.firebaseapp.com",projectId:"ssnps-police-app-7018f",storageBucket:"ssnps-police-app-7018f.firebasestorage.app",messagingSenderId:"705275454318",appId:"1:705275454318:web:a3cb76139563b6c33d977f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let currentUser=null, allSoldiers=[], allBooks=[], lang='ar';
const esc=s=> (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

document.getElementById('langBtn').onclick=()=>{
 lang=lang==='ar'?'en':'ar';
 document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';
 document.getElementById('t1').textContent=lang==='ar'?'تسجيل دخول آمن':'Secure Login';
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 alert(lang==='ar'?'تم تغيير اللغة لعربي':'Language changed to English');
};

document.getElementById('loginBtn').onclick=async()=>{
 const id=document.getElementById('userId').value.trim();
 const pass=document.getElementById('userPass').value.trim();
 const msg=document.getElementById('loginMsg');
 if(!id||!pass){msg.textContent='ادخل البيانات';return}
 msg.textContent='جاري...';
 if((id==='ADMIN' && pass==='Admin@2026') || (id==='SSNPS-5293' && pass==='5293')){
   currentUser={name:'Admin',id:id,role:'admin'}; showApp(); return;
 }
 try{
   let doc=await db.collection('soldiers').doc(id).get();
   if(!doc.exists) doc=await db.collection('admins').doc(id).get();
   if(!doc.exists){msg.textContent='ID غير موجود';return}
   if(doc.data().pass!==pass){msg.textContent='باسورد غلط';return}
   currentUser=doc.data(); showApp();
 }catch(e){msg.textContent='خطأ: '+e.message}
};

function showApp(){
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('appBox').classList.remove('hidden');
 document.getElementById('logoutBtn').style.display='inline-block';
 document.getElementById('welcome').textContent='مرحب: '+currentUser.name+' ('+currentUser.role+')';
 if(currentUser.role!=='admin'){document.getElementById('adminCard').style.display='none';document.getElementById('adminUpload').style.display='none';}
 loadSoldiers(); loadBooks();
}
document.getElementById('logoutBtn').onclick=()=>location.reload();
document.getElementById('addSoldierBtn').onclick=async()=>{
 const name=document.getElementById('soldierName').value.trim(); if(!name) return;
 const newId='SSNPS-'+Math.floor(1000+Math.random()*9000);
 const pass=Math.random().toString(36).slice(-6).toUpperCase();
 await db.collection('soldiers').doc(newId).set({name:name,id:newId,pass:pass,created:Date.now(),role:'soldier'});
 document.getElementById('soldierName').value=''; loadSoldiers();
 alert('تم: '+newId);
};
async function loadSoldiers(){try{const snap=await db.collection('soldiers').orderBy('created','desc').limit(100).get(); allSoldiers=[]; snap.forEach(d=>allSoldiers.push(d.data())); renderSoldiers(allSoldiers)}catch(e){document.getElementById('soldiersList').textContent=e.message}}
function renderSoldiers(list){let h='<b>Total: '+list.length+'</b><br><br>'; list.forEach(x=>{h+='<div class="item"><span>'+esc(x.name)+'</span><span class="badge">'+esc(x.id)+'</span></div>'}); document.getElementById('soldiersList').innerHTML=h||'لا يوجد';}
document.getElementById('searchSoldierBtn').onclick=()=>{const q=document.getElementById('searchSoldier').value.toLowerCase(); renderSoldiers(allSoldiers.filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)))};
document.getElementById('addBookBtn').onclick=async()=>{
 const file=document.getElementById('pdfFile').files[0]; const title=document.getElementById('pdfTitle').value.trim();
 if(!file||!title){document.getElementById('uploadStatus').textContent='اختر ملف';return}
 const reader=new FileReader();
 reader.onload=async e=>{await db.collection('library').add({title:title,data:e.target.result,created:Date.now()}); document.getElementById('uploadStatus').textContent='✅ تم'; loadBooks();};
 reader.readAsDataURL(file);
};
async function loadBooks(){try{const snap=await db.collection('library').orderBy('created','desc').limit(50).get(); allBooks=[]; snap.forEach(d=>allBooks.push({fid:d.id,...d.data()})); renderBooks(allBooks)}catch(e){document.getElementById('booksList').textContent=e.message}}
function renderBooks(list){let h=list.length?'':'لا يوجد كتب'; list.forEach(b=>{h+='<div class="item"><span>'+esc(b.title)+'</span><button class="btn small" onclick="viewOnly(\''+b.fid+'\')">قراءة</button></div>'}); document.getElementById('booksList').innerHTML=h;}
window.viewOnly=fid=>{const b=allBooks.find(x=>x.fid===fid); document.getElementById('modalTitle').textContent=b.title; document.getElementById('pdfViewer').innerHTML='<iframe src="'+b.data+'#toolbar=0" style="width:100%;height:90vh;border:none"></iframe>'; document.getElementById('pdfModal').style.display='flex';};
window.closeViewer=()=>{document.getElementById('pdfModal').style.display='none';};
</script>
</body>
</html>
