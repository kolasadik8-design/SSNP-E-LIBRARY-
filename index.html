<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSNPS TEST</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>body{background:#0a0e1a;color:#fff;font-family:sans-serif;padding:20px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px}button{width:100%;padding:12px;background:#0f3460;color:#fff;border:none;border-radius:8px;font-weight:800}</style>
</head>
<body>
<h2>🇸🇸 SSNPS TEST LOGIN</h2>
<input id="uid" placeholder="ID مثلا SSNPS-5293">
<input id="upass" type="password" placeholder="Password مثلا 5293">
<button onclick="login()">LOGIN</button>
<p id="msg"></p>
<script>
const firebaseConfig={apiKey:"AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",authDomain:"ssnps-police-app-7018f.firebaseapp.com",projectId:"ssnps-police-app-7018f",storageBucket:"ssnps-police-app-7018f.firebasestorage.app",messagingSenderId:"705275454318",appId:"1:705275454318:web:a3cb76139563b6c33d977f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
async function login(){
 const id=document.getElementById('uid').value.trim();
 const pass=document.getElementById('upass').value.trim();
 document.getElementById('msg').textContent='جاري...';
 try{
   let doc=await db.collection('soldiers').doc(id).get();
   if(!doc.exists){doc=await db.collection('admins').doc(id).get();}
   if(!doc.exists){document.getElementById('msg').textContent='❌ ID ما موجود في soldiers ولا admins';return;}
   if(doc.data().pass!==pass){document.getElementById('msg').textContent='❌ باسورد غلط. الصح هو: '+doc.data().pass;return;}
   document.getElementById('msg').textContent='✅ دخلت بنجاح! مرحب '+doc.data().name;
   document.body.innerHTML+='<h1 style="color:#0f0">تم الدخول! Firebase شغال ✅</h1>';
 }catch(e){document.getElementById('msg').textContent='❌ خطأ: '+e.message;}
}
</script>
</body>
</html>
