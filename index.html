<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Batch - Secure Portal</title>
<!-- Firebase SDK - LINE 6 to 9 -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;user-select:none}
.box{background:#1e293b;padding:30px;border-radius:12px;width:400px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:none}
input{background:#334155;color:#fff} button{background:#0ea5e9;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body oncontextmenu="return false;">
<div class="box">
<h2 style="text-align:center;color:#38bdf8;">BATCH SECURE LOGIN</h2>
<input id="milId" placeholder="Military ID">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:#f87171;text-align:center;margin-top:10px;"></p>
</div>

<script>
// LINE 32 - FIREBASE CONFIG - Replace with your config from Firebase Console
const firebaseConfig = {
  apiKey: "AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",
  authDomain: "ssnps-police-app-7018f.firebaseapp.com",
  projectId: "ssnps-police-app-7018f",
  storageBucket: "ssnps-police-app-7018f.firebasestorage.app",
  messagingSenderId: "705275454318",
  appId: "1:705275454318:web:4ac5261ba5beb6c33d977f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// LINE 45 - LOGIN FUNCTION
async function login(){
  const militaryId = document.getElementById('milId').value.trim();
  const password = document.getElementById('pass').value.trim();
  // Find email by military_id
  const snap = await db.collection('officers').where('military_id','==',militaryId).get();
  if(snap.empty){ document.getElementById('msg').innerText='ID not found - Contact Admin'; return; }
  const email = snap.docs[0].data().email;
  try{
    await auth.signInWithEmailAndPassword(email, password);
    localStorage.setItem('officer', JSON.stringify(snap.docs[0].data()));
    window.location.href='dashboard.html';
  }catch(e){ document.getElementById('msg').innerText=e.message; }
}

// Anti Screenshot Protection
document.addEventListener('keydown', e=>{
  if(e.key==='PrintScreen' || (e.ctrlKey && ['s','p','c'].includes(e.key.toLowerCase()))){ e.preventDefault(); alert('Action Disabled'); }
});
document.addEventListener('visibilitychange', ()=>{ document.body.style.filter=document.hidden?'blur(20px)':'none'; });
</script>
</body>
</html>
